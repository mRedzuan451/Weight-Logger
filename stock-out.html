<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Out</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1f2937">
    <link rel="stylesheet" href="./assets/css/tailwind.min.css">
    <style>
        .status-message { padding: 1rem; margin-top: 1rem; border-radius: 0.5rem; display: none; }
        .status-success { background-color: #d1fae5; color: #065f46; }
        .status-error { background-color: #fee2e2; color: #991b1b; }
    </style>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body class="min-h-screen font-sans bg-gray-100 p-6">
    <div class="w-full max-w-4xl mx-auto mt-10">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Stock Out</h1>
            <div class="flex gap-2 flex-wrap justify-center sm:justify-end">
                <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Log out</button>
                <a href="./stock-out-records.html" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">View Records</a>
                <button id="export-csv-btn" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Export CSV</button>
                <a href="./menu.html" class="inline-flex justify-center bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-5 rounded-lg transition-colors">Back to Menu</a>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Scan and info -->
            <div class="space-y-6">
                <!-- Scale Controls -->
                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 border-b pb-3">0. Connect Scale</h2>
                    <div class="flex items-center gap-3 mb-3">
                        <span id="scale-status" class="text-lg font-semibold text-red-600">Not Connected</span>
                        <span class="text-sm text-gray-500">Raw: <code id="scale-raw-data" class="bg-gray-200 px-2 py-0.5 rounded">...</code></span>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <button id="connect-scale-btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Connect Scale</button>
                        <button id="disconnect-scale-btn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors" style="display: none;">Disconnect</button>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 border-b pb-3">1. Scan Packet</h2>
                    <label for="qr-input" class="block text-sm font-medium text-gray-700 mb-1">Scan barcode/QR here:</label>
                    <input type="text" id="qr-input" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Click here and then scan...">
                    <p class="text-xs text-gray-500 mt-2">Accepts JSON or plain text codes.</p>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 border-b pb-3">2. Item Info</h2>
                    <div class="space-y-3">
                        <div><span class="font-semibold text-gray-600">Label ID:</span><span id="info-label-id" class="font-mono text-gray-800 float-right">--</span></div>
                        <div><span class="font-semibold text-gray-600">Item ID:</span><span id="info-item-id" class="font-mono text-gray-800 float-right">--</span></div>
                        <div><span class="font-semibold text-gray-600">Item Name:</span><span id="info-item-name" class="font-mono text-gray-800 float-right">--</span></div>
                        <div><span class="font-semibold text-gray-600">Lot No:</span><span id="info-lot-no" class="font-mono text-gray-800 float-right">--</span></div>
                        <div><span class="font-semibold text-gray-600">Mfg. Lot:</span><span id="info-mfg-lot" class="font-mono text-gray-800 float-right">--</span></div>
                        <div class="border-t pt-3">
                            <span class="font-semibold text-gray-600">Available Weight:</span>
                            <span id="info-available" class="text-xl font-bold text-blue-700 float-right">0.00 g</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Outgoing -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 border-b pb-3">3. Stock Out</h2>
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <span id="current-weight" class="text-4xl font-bold text-gray-800">0.00</span>
                            <span class="text-gray-600">(live)</span>
                        </div>
                        <input type="number" step="0.01" id="out-weight" class="w-48 text-center text-4xl font-bold text-gray-800 border border-gray-300 rounded-lg" placeholder="0.00">
                        <select id="unit-select" class="ml-2 text-lg border-gray-300 rounded-md shadow-sm">
                            <option value="g">g</option>
                            <option value="kg">kg</option>
                            <option value="lb">lb</option>
                            <option value="oz">oz</option>
                        </select>
                    </div>
                    <div class="mt-4 space-y-1 text-sm text-gray-600 text-left">
                        <div>Pieces to take: <span id="pieces-to-take" class="font-semibold text-gray-900">--</span></div>
                        <div class="text-xs text-gray-500">Available pieces: <span id="pieces-available" class="font-semibold text-gray-900">--</span></div>
                    </div>
                    <button id="save-out-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition-colors" disabled>
                        Save Stock Out
                    </button>
                </div>

                <div id="status-message" class="status-message"></div>
            </div>
        </div>
    </div>

    <script src="./scripts/sw-register.js" defer></script>
    <script src="./scripts/stock-out.js" defer></script>
</body>
</html>
