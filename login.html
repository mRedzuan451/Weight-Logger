<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1f2937" />
  <link rel="icon" type="image/png" sizes="256x256" href="./assets/img/logoWeightLogger_256.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/img/logoWeightLogger_512.png">
  <link rel="stylesheet" href="./assets/css/tailwind.min.css" />
</head>
<body class="h-full flex items-center justify-center font-sans bg-gray-100 p-6">
  <div class="w-full max-w-md bg-white shadow-xl rounded-xl p-8">
    <div class="flex justify-center mb-4">
      <img src="./assets/img/logoWeightLogger_256.png" alt="Weight Logger logo" class="h-16 w-16">
    </div>
    <h1 class="text-3xl font-extrabold text-gray-900 mb-2 text-center">Weight Logger Portal</h1>
    <h2 id="login-title" class="text-xl font-bold text-gray-800 mb-2 text-center">Sign in</h2>
    <p id="login-subtitle" class="text-sm text-gray-500 mb-6 text-center">Enter your username and password.</p>

    <form id="login-form" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. admin" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="••••••••" />
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors">Sign in</button>
      <p id="error" class="hidden text-sm text-red-700 bg-red-100 rounded-md px-3 py-2"></p>
    </form>

    <form id="setup-form" class="hidden space-y-4">
      <div>
        <label for="setup-username" class="block text-sm font-medium text-gray-700 mb-1">Admin username</label>
        <input id="setup-username" name="setup-username" type="text" autocomplete="username" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. admin" />
      </div>
      <div>
        <label for="setup-display-name" class="block text-sm font-medium text-gray-700 mb-1">Display name</label>
        <input id="setup-display-name" name="setup-display-name" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. Administrator" />
      </div>
      <div>
        <label for="setup-employee-id" class="block text-sm font-medium text-gray-700 mb-1">Employee ID</label>
        <input id="setup-employee-id" name="setup-employee-id" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. ADMIN01" />
      </div>
      <div>
        <label for="setup-password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input id="setup-password" name="setup-password" type="password" autocomplete="new-password" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Create a strong password" />
      </div>
      <div>
        <label for="setup-password-confirm" class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
        <input id="setup-password-confirm" name="setup-password-confirm" type="password" autocomplete="new-password" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Repeat the password" />
      </div>
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition-colors">Create administrator</button>
      <p id="setup-message" class="hidden text-sm rounded-md px-3 py-2"></p>
    </form>

  </div>

  <script src="./scripts/sw-register.js" defer></script>
  <script src="./scripts/shared-utils.js" defer></script>
  <script src="./scripts/login.js" defer></script>
</body>
</html>
