<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1f2937" />
  <link rel="stylesheet" href="./assets/css/tailwind.min.css" />
</head>
<body class="h-full flex items-center justify-center font-sans bg-gray-100 p-6">
  <div class="w-full max-w-md bg-white shadow-xl rounded-xl p-8">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-2 text-center">Weight Logger Portal</h1>
    <h2 class="text-xl font-bold text-gray-800 mb-2 text-center">Sign in</h2>
    <p class="text-sm text-gray-500 mb-6 text-center">Enter your name and employee ID. These will be recorded on stock transactions.</p>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full name</label>
        <input id="name" name="name" type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. John Tan" />
      </div>
      <div>
        <label for="employee-id" class="block text-sm font-medium text-gray-700 mb-1">Employee ID</label>
        <input id="employee-id" name="employee-id" type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. E1234" />
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors">Sign in</button>
      <p id="error" class="hidden text-sm text-red-700 bg-red-100 rounded-md px-3 py-2"></p>
    </form>

  </div>

  <script src="./scripts/sw-register.js" defer></script>
  <script src="./scripts/login.js" defer></script>
</body>
</html>
