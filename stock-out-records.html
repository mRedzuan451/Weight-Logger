<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Out Records</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1f2937">
    <link rel="stylesheet" href="./assets/css/tailwind.min.css">
</head>
<body class="min-h-screen font-sans bg-gray-100 p-6">
    <div class="w-full max-w-5xl mx-auto mt-10">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Stock Out Records</h1>
            <div class="flex flex-wrap gap-2 justify-center md:justify-end">
                <button id="export-csv-btn" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Export CSV</button>
                <a href="./stock-out.html" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Back to Stock Out</a>
                <a href="./menu.html" class="bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Menu</a>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-lg">
            <div class="overflow-x-auto">
                <div class="max-h-[70vh] overflow-y-auto rounded-lg border border-gray-200">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50 sticky top-0 z-10">
                            <tr>
                                <th scope="col" class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Date</th>
                                <th scope="col" class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Label ID</th>
                                <th scope="col" class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Item Name</th>
                                <th scope="col" class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Item ID</th>
                                <th scope="col" class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Lot No</th>
                                <th scope="col" class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Mfg Lot</th>
                                <th scope="col" class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Responsible</th>
                                <th scope="col" class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Out Weight</th>
                                <th scope="col" class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Unit</th>
                            </tr>
                        </thead>
                        <tbody id="records-body" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="9" class="py-6 text-center text-gray-500">Loading records...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div id="pagination-controls" class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mt-4 pt-4 border-t" style="display: none;">
                <button id="prev-page-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition-colors disabled:opacity-50" disabled>&larr; Previous</button>
                <span id="page-info" class="text-gray-700 font-medium text-center">Page 1 of 1</span>
                <button id="next-page-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors disabled:opacity-50" disabled>Next &rarr;</button>
            </div>
        </div>
    </div>

    <script src="./scripts/sw-register.js" defer></script>
    <script src="./scripts/stock-out-records.js" defer></script>
</body>
</html>
