<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Menu</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1f2937">
    <link rel="stylesheet" href="./assets/css/tailwind.min.css">
</head>
<body class="h-full flex items-center justify-center font-sans bg-gray-100 p-6">
    <div class="max-w-xl w-full bg-white shadow-xl rounded-xl p-10 space-y-9 text-center">
        <div class="flex justify-end">
            <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
                Log out
            </button>
        </div>
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Contact Store Operations</h1>
            <p class="mt-2 text-gray-500">Choose the task you want to perform.</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <a href="./index.html" class="block w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-4 rounded-lg transition-colors">
                Stock In
            </a>
            <a href="./stock-out.html" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-lg transition-colors">
                Stock Out
            </a>
            <a href="./stock-take.html" class="block w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-4 rounded-lg transition-colors">
                Stock Take
            </a>
            <a href="./stock-list.html" class="block w-full bg-teal-500 hover:bg-teal-600 text-white font-semibold py-4 rounded-lg transition-colors">
                Stock List
            </a>
            <a id="admin-btn" href="./admin.html" class="hidden block w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-4 rounded-lg transition-colors">
                Admin
            </a>
        </div>
    </div>

    <script src="./scripts/sw-register.js" defer></script>
    <script src="./scripts/menu.js" defer></script>
</body>
</html>
