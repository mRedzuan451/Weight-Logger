<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock List</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1f2937" />
  <link rel="stylesheet" href="./assets/css/tailwind.min.css">
</head>
<body class="min-h-screen font-sans bg-gray-100 p-6">
  <div class="w-full max-w-6xl mx-auto mt-6 space-y-6">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <h1 class="text-3xl font-bold text-gray-800">Current Stock List</h1>
      <div class="flex gap-2 flex-wrap justify-center sm:justify-end">
        <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Log out</button>
        <a href="./menu.html" class="bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Menu</a>
      </div>
    </div>

    <div id="stocklist-status" class="hidden px-4 py-3 rounded-lg text-sm font-semibold"></div>

    <div class="bg-white p-6 rounded-lg shadow">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-4 border-b pb-3">
        <h2 class="text-xl font-semibold">In-Stock Items</h2>
        <div class="w-full md:w-64">
          <label for="stocklist-search" class="block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1">Search</label>
          <input id="stocklist-search" type="text" placeholder="Search label, item, lot..." class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-sky-500 focus:border-sky-500 text-sm" />
        </div>
      </div>
      <div class="overflow-x-auto">
        <div class="max-h-[70vh] overflow-y-auto rounded-lg border border-gray-200">
          <table class="min-w-full divide-y divide-gray-200 text-sm">
            <thead class="bg-gray-50 sticky top-0 z-10">
              <tr>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Label ID</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Item Name</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Item ID</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Lot No</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Mfg Lot</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Quantity</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Expected Weight</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Unit</th>
              </tr>
            </thead>
            <tbody id="stocklist-body" class="bg-white divide-y divide-gray-200">
              <tr>
                <td colspan="8" class="py-6 text-center text-gray-500">Loading current stock...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="./scripts/sw-register.js" defer></script>
  <script src="./scripts/stock-list.js" defer></script>
</body>
</html>
