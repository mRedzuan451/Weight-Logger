<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - History Logs</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1f2937" />
  <link rel="stylesheet" href="./assets/css/tailwind.min.css">
  <style>
    .status-message { padding: 1rem; border-radius: 0.5rem; display: none; font-weight: 600; }
    .status-success { background-color: #d1fae5; color: #065f46; }
    .status-error { background-color: #fee2e2; color: #991b1b; }
  </style>
</head>
<body class="min-h-screen font-sans bg-gray-100 p-6">
  <div class="w-full max-w-6xl mx-auto mt-6 space-y-6">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <h1 class="text-3xl font-bold text-gray-800">Admin: Stock In/Out History</h1>
      <div class="flex gap-2 flex-wrap justify-center sm:justify-end">
        <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Log out</button>
        <a href="./menu.html" class="bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Menu</a>
        <a href="./login-records.html" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Login Records</a>
        <a href="./users.html" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Manage Users</a>
        <button id="clear-data-btn" class="bg-red-700 hover:bg-red-800 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Clear All Data</button>
      </div>
    </div>

    <div id="admin-status" class="status-message"></div>

    <div class="bg-white p-4 rounded-lg shadow">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-3 md:items-end">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1" for="from-date">From</label>
          <input id="from-date" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" />
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1" for="to-date">To</label>
          <input id="to-date" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" />
        </div>
        <div class="flex gap-2">
          <button id="apply-filter" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Apply</button>
          <button id="clear-filter" class="flex-1 bg-gray-400 hover:bg-gray-500 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Clear</button>
          <button id="export-csv" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Export CSV</button>
        </div>
      </div>
    </div>

    <div class="bg-white p-0 rounded-lg shadow overflow-hidden">
      <div class="max-h-[70vh] overflow-y-auto">
        <table class="min-w-full divide-y divide-gray-200 text-sm">
          <thead class="bg-gray-50 sticky top-0 z-10">
            <tr>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Date</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Type</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Label ID</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Item Name</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Item ID</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Lot No</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Mfg Lot</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Weight</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Unit</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Responsible</th>
            </tr>
          </thead>
          <tbody id="admin-records-body" class="bg-white divide-y divide-gray-200">
            <tr>
              <td colspan="10" class="py-6 text-center text-gray-500">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="./scripts/sw-register.js" defer></script>
  <script src="./scripts/admin.js" defer></script>
</body>
</html>
