<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1f2937" />
  <link rel="icon" type="image/png" sizes="256x256" href="./assets/img/logoWeightLogger_256.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/img/logoWeightLogger_512.png">
  <link rel="stylesheet" href="./assets/css/tailwind.min.css">
</head>
<body class="min-h-screen font-sans bg-gray-100 p-6">
  <div class="w-full max-w-6xl mx-auto mt-6 space-y-6">
    <div class="sticky top-0 z-20 bg-gray-100 py-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <h1 class="text-3xl font-bold text-gray-800">Admin: User Accounts &amp; Login Records</h1>
      <div class="flex gap-2 flex-wrap justify-center sm:justify-end">
        <a href="./admin.html" class="bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg transition-colors">History Logs</a>
        <a href="./menu.html" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Menu</a>
      </div>
    </div>

    <div class="flex flex-wrap gap-2 justify-start sm:justify-end">
      <button id="users-backup-json" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Backup JSON</button>
      <button id="users-restore-json" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Restore JSON</button>
    </div>
    <input id="users-restore-file" type="file" accept="application/json" class="hidden" />
    <p id="storage-usage" class="mt-1 text-xs text-gray-600 text-right"></p>

    <div id="user-status" class="hidden px-4 py-3 rounded-lg text-sm font-semibold"></div>

    <!-- Add / Edit User Form -->
    <div class="bg-white p-4 rounded-lg shadow space-y-4">
      <h2 class="text-xl font-semibold text-gray-800 border-b pb-2">Add User</h2>
      <form id="user-form" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
        <div>
          <label for="user-username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input id="user-username" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. steven" required />
        </div>
        <div>
          <label for="user-display-name" class="block text-sm font-medium text-gray-700 mb-1">Display name</label>
          <input id="user-display-name" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. Steven" />
        </div>
        <div>
          <label for="user-employee-id" class="block text-sm font-medium text-gray-700 mb-1">Employee ID</label>
          <input id="user-employee-id" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. E12345" />
        </div>
        <div>
          <label for="user-role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
          <select id="user-role" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div>
          <label for="user-password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="user-password" type="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Initial password" required />
        </div>
        <div class="md:col-span-5 flex justify-end">
          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors">Save User</button>
        </div>
      </form>
    </div>

    <!-- User List -->
    <div class="bg-white p-4 rounded-lg shadow">
      <div class="flex justify-between items-center mb-3 border-b pb-2">
        <h2 class="text-xl font-semibold text-gray-800">Existing Users</h2>
        <span id="user-count" class="text-sm text-gray-500"></span>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Username</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Display Name</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Employee ID</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Role</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Status</th>
              <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Actions</th>
            </tr>
          </thead>
          <tbody id="users-body" class="bg-white divide-y divide-gray-200">
            <tr>
              <td colspan="6" class="py-6 text-center text-gray-500">Loading users...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Login Records (moved from login-records.html) -->
    <div class="bg-white p-4 rounded-lg shadow">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-3 border-b pb-2">
        <h2 class="text-xl font-semibold text-gray-800">Login Activity</h2>
      </div>
      <div class="overflow-x-auto">
        <div class="max-h-[70vh] overflow-y-auto rounded-lg border border-gray-200">
          <table class="min-w-full divide-y divide-gray-200 text-sm">
            <thead class="bg-gray-50 sticky top-0 z-10">
              <tr>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Date</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Employee ID</th>
                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">Display</th>
              </tr>
            </thead>
            <tbody id="login-records-body" class="bg-white divide-y divide-gray-200">
              <tr>
                <td colspan="3" class="py-6 text-center text-gray-500">Loading records...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div id="pagination-controls" class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mt-4 pt-4 border-t" style="display: none;">
        <button id="prev-page-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition-colors disabled:opacity-50" disabled>&larr; Previous</button>
        <span id="page-info" class="text-gray-700 font-medium text-center">Page 1 of 1</span>
        <button id="next-page-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors disabled:opacity-50" disabled>Next &rarr;</button>
      </div>
    </div>
  </div>

  <script src="./scripts/sw-register.js" defer></script>
  <script src="./scripts/users.js" defer></script>
  <script src="./scripts/login-records.js" defer></script>
</body>
</html>
